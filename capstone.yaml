run: "docker compose up --build"
seed: "docker compose exec backend python -m app.seed"
test: "uv run pytest"
base_url: "http://localhost:8000"
endpoints:
  health: "/api/v1/system/health/live"
  readiness: "/api/v1/system/health/ready"
  login: "/api/v1/auth/token"
  widgets: "/api/v1/widgets"
  widget_embed: "/api/v1/widgets/{widget_id}/embed"
  widget_config: "/api/v1/public/widgets/{widget_id}/config"
  widget_script: "/api/v1/public/widgets/bundle/v1/widget.js"
  submissions: "/api/v1/public/widgets/{widget_id}/submissions"
  dashboard: "/api/v1/dashboard/submissions"
demo_page: "demo/index.html"
worker: "docker compose exec backend python -m app.worker --once"
status: "in-progress"
