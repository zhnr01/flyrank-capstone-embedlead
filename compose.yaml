services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: embedlead
      POSTGRES_USER: embedlead
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embedlead -d embedlead"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - embedlead-db-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PROJECT_NAME: EmbedLead Widget Platform
      ENVIRONMENT: local
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: embedlead
      POSTGRES_USER: embedlead
      POSTGRES_PASSWORD: local-development-only
      BACKEND_CORS_ORIGINS: '["http://localhost:5500","http://127.0.0.1:5500"]'
      MAX_SUBMISSION_BYTES: "8192"
      SUBMISSION_RATE_LIMIT_PER_IP: "5"
      SUBMISSION_RATE_LIMIT_PER_WIDGET: "30"
      SUBMISSION_RATE_LIMIT_WINDOW_SECONDS: "60"
      GEO_ENRICHMENT_ENABLED: "true"
      GEO_PROVIDER_A_ENABLED: "true"
      GEO_PROVIDER_B_ENABLED: "true"
      GEO_PROVIDER_TIMEOUT_SECONDS: "1.0"
      OUTBOX_MAX_ATTEMPTS: "3"
      OUTBOX_POLL_SECONDS: "2.0"
      WIDGET_BUNDLE_VERSION: "v2"
      PUBLIC_BASE_URL: "http://localhost:8000"
      LOG_LEVEL: "INFO"
      METRICS_TOKEN: "local-development-only-metrics-token"
      METRICS_MAX_ROUTES: "64"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  embedlead-db-data:
