[project]
name = "embedlead"
version = "0.1.0"
description = "Embeddable widget and lead-capture platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.139.0,<1.0.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
