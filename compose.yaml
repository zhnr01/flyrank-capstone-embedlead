services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: embedlead
      POSTGRES_USER: embedlead
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embedlead -d embedlead"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - embedlead-db-data:/var/lib/postgresql

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: EmbedLead Widget Platform
      ENVIRONMENT: local
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: embedlead
      POSTGRES_USER: embedlead
      POSTGRES_PASSWORD: local-development-only
      BACKEND_CORS_ORIGINS: '["http://localhost:5500","http://127.0.0.1:5500"]'
      MAX_SUBMISSION_BYTES: "8192"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  embedlead-db-data:
