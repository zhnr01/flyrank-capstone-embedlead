run: "docker compose up --build"
seed: "NOT_IMPLEMENTED_YET"
test: "uv run pytest"
base_url: "http://localhost:8000"
endpoints:
  health: "/api/v1/system/health/live"
  readiness: "/api/v1/system/health/ready"
  login: "/api/v1/auth/token"
  widgets: "/api/v1/widgets"
  widget_config: "/api/v1/public/widgets/{public_id}/config"
  widget_script: "/api/v1/public/widget.js"
  submissions: "/api/v1/public/widgets/{public_id}/submissions"
  dashboard: "/api/v1/dashboard/submissions"
status: "in-progress"
